# ==========================================================
# MacroFlow V65 Alert — konfigurasi
# ==========================================================

# Kosongkan = semua saham IDX (daftar otomatis diperbarui tiap 7 hari).
# Isi kalau mau batasi, contoh:
# tickers: [BBCA, BBRI, ANTM, ARCI]
tickers: []

# Indeks yang selalu dicek (tanpa filter likuiditas), tampil paling atas di Telegram.
# ROYAL dimatikan untuk IHSG karena volume indeks di Yahoo tidak akurat.
indices:
  IHSG:
    yahoo: "^JKSE"
    tradingview: "IDX:COMPOSITE"
    signals: [COMBO, STANDAR, METER]

# Filter supaya saham tidak likuid tidak ikut dikirim
filter:
  min_avg_value: 2000000000   # rata-rata nilai transaksi 20 hari (Rp). 2 M = 2 miliar
  min_price: 50               # harga minimum (Rp)

# Sinyal yang dikirim per timeframe & arah (hapus yang tidak perlu).
# Pilihan: ROYAL, COMBO, GOLDEN (khusus BUY), STANDAR, METER.
# Bisa juga ditulis singkat untuk kedua arah, contoh:  D: [COMBO, METER]
# Dasar pilihan saat ini: backtest 1 Apr–30 Sep 2026 (GOLDEN paling rugi; 1H BUY terbaik COMBO & METER).
signals:
  D:
    BUY:  [ROYAL, COMBO, STANDAR, METER]
    SELL: [ROYAL, COMBO, STANDAR, METER]
  1H:
    BUY:  [COMBO, METER]
    SELL: [ROYAL, COMBO, STANDAR, METER]

# Status IHSG di atas setiap notifikasi (arah, rezim EMA200, Illu Trx, Meter) +
# PERINGATAN KERAS bila IHSG mendapat sinyal SELL di beberapa candle berbeda dalam
# beberapa hari bursa terakhir. Uji dulu dengan perintah `ihsg-study` di menu Run workflow.
market_warning:
  index: IHSG
  window_days: 5                    # jumlah hari bursa yang dilihat
  min_events: 2                     # peringatan keras bila jumlah candle bersinyal SELL >= angka ini
  signals: [COMBO, STANDAR, METER]  # jenis sinyal SELL yang dihitung (METER = STRONG SELL)
  timeframes: [D, 1H]               # timeframe yang dihitung

# Parameter indikator (sama dengan input Pine Script)
params:
  ut_key: 2.0          # Illu Trx Key Value
  ut_period: 10        # Illu Trx ATR Period
  stoch_k: 14
  stoch_d: 3
  stoch_s: 3
  meter_ema: 50
  meter_rsi: 14
  meter_adx: 14
  meter_thres: 20
  atr_mult_sl: 2.0     # SL = close - ATR14 x angka ini; TP1 = 2R, TP2 = 3R

# Panjang histori yang diunduh
daily_period: 3y
hourly_period: 1y
