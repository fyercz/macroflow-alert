# ==========================================================
# MacroFlow V65 Alert — konfigurasi
# ==========================================================

# Kosongkan = semua saham IDX (daftar otomatis diperbarui tiap 7 hari).
# Isi kalau mau batasi, contoh:
# tickers: [BBCA, BBRI, ANTM, ARCI]
tickers: []

# ALERT INDEKS — pesan tersendiri, hanya timeframe Daily & Weekly.
#   IHSG   : dikirim ±16:15 WIB (Sen–Jum) setelah bursa tutup
#   S&P 500: dikirim ±05:15 WIB (Sel–Sab) setelah bursa AS tutup
# Weekly dikirim setelah minggunya selesai (Jumat). ROYAL & GOLDEN tidak dipakai untuk indeks.
index_alert:
  meter_ma: SMA                       # STRONG BUY/SELL: harga vs SMA50 (saham tetap EMA50)
  timeframes: [D, W]
  signals: [COMBO, STANDAR, METER, CHOCH, BOS, OB, FVG]   # METER = STRONG BUY / STRONG SELL; 4 terakhir = SMC
  indices:
    IHSG:  {yahoo: "^JKSE", tradingview: "IDX:COMPOSITE", name: "IHSG", market: IDX}
    SP500: {yahoo: "^GSPC", tradingview: "SP:SPX", name: "S&P 500", market: US}

# (opsional) indeks yang ikut scan saham per jam. Dikosongkan: IHSG sekarang lewat index_alert.
indices: {}

# Filter supaya saham tidak likuid tidak ikut dikirim
filter:
  min_avg_value: 2000000000   # rata-rata nilai transaksi 20 hari (Rp). 2 M = 2 miliar
  min_price: 50               # harga minimum (Rp)

# Sinyal yang dikirim per timeframe & arah (hapus yang tidak perlu).
# Pilihan: ROYAL, COMBO, GOLDEN (khusus BUY), STANDAR, METER,
#          SMC (port LuxAlgo): CHOCH (pembalikan struktur), BOS (lanjutan struktur),
#          OB (order block ditembus: BUY = supply jebol ke atas, SELL = demand jebol ke bawah), FVG (fair value gap).
# Bisa juga ditulis singkat untuk kedua arah, contoh:  D: [COMBO, METER]
# Dasar pilihan saat ini: backtest 1 Apr–30 Sep 2026 (GOLDEN paling rugi; 1H BUY terbaik COMBO & METER).
# SMC di 1H hanya CHOCH & OB (BOS & FVG di 1H sangat sering muncul) — tambahkan kalau mau.
signals:
  D:
    BUY:  [ROYAL, COMBO, STANDAR, METER, CHOCH, BOS, OB, FVG]
    SELL: [ROYAL, COMBO, STANDAR, METER, CHOCH, BOS, OB, FVG]
  1H:
    BUY:  [COMBO, METER, CHOCH, OB]
    SELL: [ROYAL, COMBO, STANDAR, METER, CHOCH, OB]

# Status IHSG di atas setiap notifikasi saham (arah, rezim EMA200, Illu Trx, Meter D & W) +
# PERINGATAN KERAS bila IHSG mendapat sinyal SELL di beberapa candle berbeda dalam
# beberapa hari bursa terakhir. Uji dulu dengan perintah `ihsg-study` di menu Run workflow.
market_warning:
  index: IHSG
  window_days: 5                    # jumlah hari bursa yang dilihat
  min_events: 2                     # peringatan keras bila jumlah candle bersinyal SELL >= angka ini
  signals: [COMBO, STANDAR, METER]  # jenis sinyal SELL yang dihitung (METER = STRONG SELL)
  timeframes: [D, W]                # timeframe yang dihitung (Daily & Weekly; 1H tidak dipakai)

# Parameter indikator (sama dengan input Pine Script)
params:
  smc_swing: 50        # SMC LuxAlgo: panjang struktur swing (garis tegas di chart)
  smc_internal: 5      # SMC LuxAlgo: panjang struktur internal (garis putus-putus)
  heikin_ashi: true    # semua indikator dihitung dari candle Heikin Ashi (seperti chart HA di TradingView).
                       # Harga yang ditampilkan, SL/TP, dan backtest tetap memakai harga asli.
  ut_key: 2.0          # Illu Trx Key Value
  ut_period: 10        # Illu Trx ATR Period
  stoch_k: 14
  stoch_d: 3
  stoch_s: 3
  meter_ema: 50
  meter_rsi: 14
  meter_adx: 14
  meter_thres: 20
  atr_mult_sl: 2.0     # SL = close - ATR14 x angka ini; TP1 = 2R, TP2 = 3R

# Panjang histori yang diunduh
daily_period: 3y
hourly_period: 1y
