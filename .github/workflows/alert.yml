name: MacroFlow Alert

on:
  schedule:
    # Jam dalam UTC (WIB - 7). Senin-Jumat.
    # 10:15 11:15 12:15 14:15 15:15 16:15 WIB -> sinyal 1H (16:15 juga Daily FINAL + alert IHSG)
    - cron: "15 3,4,5,7,8,9 * * 1-5"
    # 14:45 WIB -> sinyal Daily SEMENTARA (sebelum pre-closing)
    - cron: "45 7 * * 1-5"
    # 05:15 WIB Selasa-Sabtu -> alert indeks bursa AS (S&P 500) setelah close
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      command:
        description: "Perintah"
        type: choice
        default: test-telegram
        options: [test-telegram, backtest, ihsg-study, auto, "run daily-final", "run daily-preclose", "run hourly", "run index-idx", "run index-us"]
      start:
        description: "Backtest: tanggal mulai (YYYY-MM-DD)"
        default: "2026-04-01"
      end:
        description: "Backtest: tanggal akhir (YYYY-MM-DD, kosongkan = sampai hari ini)"
        default: ""
      tf:
        description: "Backtest: timeframe (D saja jauh lebih cepat)"
        type: choice
        default: "D dan 1H"
        options: ["D dan 1H", "D", "1H"]

concurrency:
  group: macroflow
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    # backtest periode panjang butuh waktu lebih lama
    timeout-minutes: ${{ github.event.inputs.command == 'backtest' && 180 || 50 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # state.json (anti dobel notifikasi) & tickers.txt disimpan antar-run
      - uses: actions/cache/restore@v5
        with:
          path: |
            state.json
            tickers.txt
          key: macroflow-state-${{ github.run_id }}
          restore-keys: macroflow-state-

      - name: Jalankan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CMD: ${{ github.event.inputs.command || 'auto' }}
          BT_START: ${{ github.event.inputs.start }}
          BT_END: ${{ github.event.inputs.end }}
          BT_TF: ${{ github.event.inputs.tf }}
        run: |
          if [ "$CMD" = "backtest" ]; then
            ARGS=(--start "$BT_START" --telegram)
            [ -n "$BT_END" ] && ARGS+=(--end "$BT_END")
            case "$BT_TF" in
              D) ARGS+=(--tf D) ;;
              1H) ARGS+=(--tf 1H) ;;
            esac
            python -m macroflow.main backtest "${ARGS[@]}"
          elif [ "$CMD" = "ihsg-study" ]; then
            python -m macroflow.main ihsg-study --telegram
          else
            python -m macroflow.main $CMD
          fi

      - name: Simpan hasil backtest
        if: github.event.inputs.command == 'backtest'
        uses: actions/upload-artifact@v6
        with:
          name: backtest-hasil
          path: backtest_hasil.xlsx
          if-no-files-found: warn

      - name: Simpan hasil studi IHSG
        if: github.event.inputs.command == 'ihsg-study'
        uses: actions/upload-artifact@v6
        with:
          name: ihsg-study
          path: ihsg_study.xlsx
          if-no-files-found: warn

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            state.json
            tickers.txt
          key: macroflow-state-${{ github.run_id }}
